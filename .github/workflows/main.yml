
name: Build GD Physics Toolkit

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/main.yml'
      - 'CMakeLists.txt'
      - 'mod.json'
      - 'src/**'

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build Android mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: 'given'
          target: Android64

      - name: Find Geode files
        id: find-mod
        shell: bash
        run: |
          echo "Searching for .geode files..."
          find . -type f -name "*.geode" -print

          FILE="$(find . -type f -name "*.geode" -print -quit)"

          if [ -z "$FILE" ]; then
            echo "ERROR: No .geode file was found."
            echo "Listing likely build directories:"
            find . -maxdepth 5 -type d \
              \( -name bin -o -name build -o -name dist \) \
              -print
            exit 1
          fi

          echo "Found: $FILE"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"

      - name: Upload Geode mod
        uses: actions/upload-artifact@v4
        with:
          name: GD-Physics-Toolkit-Android
          path: ${{ steps.find-mod.outputs.file }}
          if-no-files-found: error
          
