name: Build GD Physics Toolkit

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/main.yml'
      - 'CMakeLists.txt'
      - 'mod.json'
      - 'src/**'

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build Android mod
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: 'given'
          target: Android64

      - name: Find Geode package
        run: |
          echo "Searching for Geode packages..."
          find . -type f -name "*.geode" -print

      - name: Upload Geode mod
        uses: actions/upload-artifact@v4
        with:
          name: GD-Physics-Toolkit-Android
          path: '**/*.geode'
          if-no-files-found: error
