name: Build GD Physics Toolkit

on:
workflow_dispatch:
push:
paths:
- ".github/workflows/main.yml"
- "CMakeLists.txt"
- "mod.json"
- "src/**"

jobs:
build:
runs-on: ubuntu-22.04

steps:
  - name: Checkout source
    uses: actions/checkout@v4

  - name: Build Android64
    uses: geode-sdk/build-geode-mod@main
    with:
      sdk: "3.0.0"
      target: Android64
