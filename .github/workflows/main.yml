name: Build GD Physics Toolkit

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/main.yml'
      - 'CMakeLists.txt'
      - 'mod.json'
      - 'src/**'

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Build Android mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: 'given'
          target: Android64

      - name: List build output
        run: |
          echo "Checking Geode output..."
          ls -lah "${{ steps.build.outputs.build-output }}"
          find "${{ steps.build.outputs.build-output }}" -type f -name "*.geode" -print

      - name: Upload Geode mod
        uses: actions/upload-artifact@v7
        with:
          name: GD-Physics-Toolkit-Android
          path: ${{ steps.build.outputs.build-output }}
          if-no-files-found: error
